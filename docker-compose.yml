version: "3.8"

services:
  app:
    image: ghcr.io/danielbrendel/saytext-chat:latest
    ports:
      - "8080:80"
    volumes:
      - app_logs:/var/www/html/app/logs
      - app_migrate:/var/www/html/app/migrations
      - app_images:/var/www/html/public/img
      - app_sounds:/var/www/html/public/snd
    environment:
      APP_SERVERNAME: "SayText Chat Server"
      APP_SERVERTOPIC: "Welcome to this SayText Chat server"
      APP_SERVERPREVIEW: "preview.png"
      APP_DELAY_FETCH: 10000
      APP_DELAY_ONLINE: 10000
      APP_RESOURCEHOST: "https://resources.saytextchat.com"
      APP_SERVERLISTHOST: "https://www.saytextchat.com"
      APP_TOKENFILTERS: ""
      APP_ENABLEPWA: "false"
      APP_TIMEZONE: "UTC"
      LOG_ENABLE: 1
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: chatstrike
      DB_USERNAME: user
      DB_PASSWORD: password
      DB_CHARSET: "utf8mb4"
    depends_on:
      - db

  db:
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: my-secret-pw
      MARIADB_DATABASE: chatstrike
      MARIADB_USER: user
      MARIADB_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  app_logs:
  app_migrate:
  app_images:
  app_sounds:
